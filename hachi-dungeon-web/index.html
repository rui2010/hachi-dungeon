<!DOCTYPE html>
<html lang="ja">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>八勇者の迷宮</title>

<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;overscroll-behavior:none;
  font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#fff}
#game{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.hide{display:none!important}
button{font-family:inherit;color:inherit;cursor:pointer}
/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;
  padding:max(6px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}
#hudTop{display:flex;align-items:center;gap:12px}
#hpbox{display:flex;align-items:center;gap:6px}
#hpbar{width:120px;height:12px;background:#2a0d12;border:2px solid #000;box-shadow:0 0 0 1px #6a5a6a;position:relative}
#hpfill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ff6a6a,#d42a3a);width:100%}
#hptext,#floorTxt,#enemyTxt{font-size:12px;font-weight:800;text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000}
#floorTxt{color:#ffd76a}
#enemyTxt{color:#cfe}
#buffs{font-size:13px;margin-left:4px;letter-spacing:1px;filter:drop-shadow(1px 1px 0 #000)}
#pauseBtn{pointer-events:auto;margin-left:auto;width:36px;height:30px;border:2px solid #000;background:rgba(30,25,40,.8);
  box-shadow:inset 0 0 0 1px #776;font-weight:900;font-size:13px}
#bossBar{position:absolute;left:50%;transform:translateX(-50%);top:max(30px,calc(env(safe-area-inset-top) + 26px));width:min(50%,320px);text-align:center}
#bossName{font-size:12px;font-weight:800;color:#ffb0b0;text-shadow:1px 1px 0 #000,-1px -1px 0 #000}
#bossBar .bar{height:8px;background:#200;border:2px solid #000;box-shadow:0 0 0 1px #855;margin-top:2px}
#bossFill{height:100%;background:linear-gradient(#ff9a3a,#d0301a);width:100%}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:26px;font-weight:900;letter-spacing:2px;
  text-shadow:2px 2px 0 #000,-2px 2px 0 #000,2px -2px 0 #000,-2px -2px 0 #000;opacity:0;transition:opacity .3s}
#banner small{display:block;font-size:13px;color:#ffd76a;letter-spacing:1px}
/* ---------- Controls ---------- */
#ctrl{position:absolute;inset:0;pointer-events:none}
#mpad{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));
  width:150px;height:76px;pointer-events:auto;display:flex;gap:8px;touch-action:none}
#mpad .arrow{flex:1;border-radius:14px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;font-size:26px;color:rgba(255,255,255,.75)}
#mpad .arrow.on{background:rgba(255,255,255,.32)}
#bpad{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));
  width:170px;height:150px;pointer-events:none}
.btn{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);
  color:rgba(255,255,255,.85);font-weight:900;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  line-height:1;touch-action:none;padding:0}
.btn small{font-size:9px;margin-top:3px;opacity:.8}
.btn.on{background:rgba(255,255,255,.35)}
#bAtk{width:76px;height:76px;right:0;bottom:0;background:rgba(255,90,90,.22);border-color:rgba(255,140,140,.5)}
#bJump{width:62px;height:62px;right:86px;bottom:0}
#bSkill{width:58px;height:58px;right:8px;bottom:86px;background:rgba(255,215,90,.18);border-color:rgba(255,215,90,.5)}
#bDash{width:52px;height:52px;right:90px;bottom:72px}
#bSkill.cool{color:rgba(255,255,255,.35)}
/* ---------- Screens ---------- */
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
  padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.dim{background:rgba(5,3,10,.72)}
.pxbtn{background:#3a2c55;border:3px solid #000;box-shadow:inset 0 -4px 0 #241a38,inset 0 0 0 2px #7a66a8;padding:10px 26px;font-size:17px;font-weight:900;
  letter-spacing:1px;min-width:170px;text-shadow:1px 1px 0 #000}
.pxbtn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 #241a38,inset 0 0 0 2px #7a66a8}
.pxbtn.gold{background:#a8761c;box-shadow:inset 0 -4px 0 #6a4810,inset 0 0 0 2px #ffd76a}
.pxbtn.small{min-width:0;padding:7px 14px;font-size:14px}
#title h1{margin:0;font-size:44px;letter-spacing:6px;color:#ffe08a;
  text-shadow:3px 3px 0 #7a2a10,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,4px 4px 0 #000}
#title .sub{font-size:13px;color:#cbb;margin:6px 0 18px;letter-spacing:2px;text-shadow:1px 1px 0 #000}
#title .note{font-size:11px;color:#9a9;margin-top:12px;text-shadow:1px 1px 0 #000}
/* select */
#select{flex-direction:row;gap:14px;background:rgba(5,3,10,.55)}
#heroGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:0 0 auto}
.hcard{width:74px;height:84px;background:#1e1830;border:3px solid #000;box-shadow:inset 0 0 0 2px #4a3e6a;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;padding:3px 0 5px;font-size:12px;font-weight:800;position:relative}
.hcard img{width:48px;height:48px;image-rendering:pixelated;margin-bottom:4px}
.hcard.sel{background:#3a2c55;box-shadow:inset 0 0 0 2px #ffd76a}
.hcard .badge{position:absolute;top:2px;right:4px;font-size:10px;color:#ffd76a}
#heroInfo{width:min(330px,42vw);background:#16121f;border:3px solid #000;box-shadow:inset 0 0 0 2px #4a3e6a;padding:10px 12px;font-size:12px;
  display:flex;flex-direction:column;gap:5px;max-height:100%;overflow:hidden}
#heroInfo h2{margin:0;font-size:20px;color:#ffe08a;display:flex;align-items:baseline;gap:8px}
#heroInfo h2 span{font-size:11px;color:#aab;font-weight:600}
.stat{display:flex;align-items:center;gap:6px}
.stat b{width:34px;color:#cbd}
.stat .sb{flex:1;height:8px;background:#000;border:1px solid #445}
.stat .sb i{display:block;height:100%;background:#7ad06a}
.skillBox{background:#221a33;border:2px solid #000;padding:5px 7px;line-height:1.45}
.skillBox em{font-style:normal;color:#ffd76a;font-weight:800}
.rec{color:#9ab;font-size:11px}
#selectTop{position:absolute;top:max(8px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));font-weight:900;font-size:15px;
  text-shadow:1px 1px 0 #000;color:#ffe08a}
/* upgrade */
#upgrade h2{margin:0 0 4px;font-size:22px;color:#ffe08a;text-shadow:2px 2px 0 #000}
#upgrade .sub{font-size:12px;color:#cbd;margin-bottom:12px}
#upCards{display:flex;gap:12px}
.ucard{width:min(170px,28vw);min-height:150px;background:#1e1830;border:3px solid #000;box-shadow:inset 0 0 0 2px #6a5a9a;padding:10px 8px;
  display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.ucard:active{transform:translateY(2px)}
.ucard .ic{font-size:34px;line-height:1.1}
.ucard .nm{font-weight:900;font-size:15px;color:#ffe08a}
.ucard .ds{font-size:12px;color:#dde;line-height:1.4}
.ucard .lv{font-size:10px;color:#9ab;margin-top:auto}
/* result / pause */
.panel{background:#16121f;border:3px solid #000;box-shadow:inset 0 0 0 2px #4a3e6a;padding:16px 26px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.panel h2{margin:0;font-size:26px;letter-spacing:2px}
.panel .rows{font-size:13px;line-height:1.7;color:#dde}
.row2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#rotate{position:absolute;inset:0;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-weight:800;font-size:16px;z-index:50}
#rotate .ph{font-size:46px;animation:rot 1.6s infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rotate{display:flex}}
@media (max-height:340px){
  #title h1{font-size:34px}
  .hcard{width:64px;height:70px}.hcard img{width:40px;height:40px;margin-bottom:2px}
  #heroInfo{font-size:11px;gap:3px;padding:7px 10px}
  #heroInfo h2{font-size:17px}
  .ucard{min-height:120px}
  #mpad{width:136px;height:66px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hide">

<div id="title" class="screen">

</div>

<div id="select" class="screen hide">

</div>

<div id="upgrade" class="screen dim hide">

<div id="pause" class="screen dim hide">

    <h2>一時停止</h2>
    <div class="rows" id="pauseInfo"></div>
    <div class="row2">
      <button class="pxbtn small" id="resumeBtn">再開</button>
      <button class="pxbtn small" id="soundBtn">音：ON</button>
      <button class="pxbtn small" id="quitBtn">あきらめる</button>
    </div>
  </div>
</div>

<div id="result" class="screen dim hide">
  <div class="panel">
    <h2 id="resTitle">GAME OVER</h2>
    <div class="rows" id="resRows"></div>
    <div class="row2">
      <button class="pxbtn small gold" id="retryBtn">もう一度</button>
      <button class="pxbtn small" id="toSelectBtn">勇者をえらぶ</button>
    </div>
  </div>
</div>

<div id="rotate"><div class="ph">📱</div>横向きにしてね</div>

<script>
'use strict';
/* =========================================================
   八勇者の迷宮 — 横スクロール ドット絵ローグライク
   完全オフライン動作（外部ファイル・通信なし）
   ========================================================= */
const $=id=>document.getElementById(id);
const cv=$('game'), ctx=cv.getContext('2d');
let W=300; const H=144, T=16, ROWS=11; let OY=0, camY=0;
function resize(){
  const a=Math.max(1,innerWidth/Math.max(1,innerHeight));
  W=Math.max(220,Math.min(360,Math.round(H*a)));
  cv.width=W; cv.height=H; ctx.imageSmoothingEnabled=false;
}
addEventListener('resize',resize); resize();

const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const sign=v=>v<0?-1:1;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const cx=e=>e.x+e.w/2, cy=e=>e.y+e.h/2;

/* ---------------- Storage (安全に) ---------------- */
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let records=store.get('hd_records',{});
let soundOn=store.get('hd_sound',true);

/* ---------------- Audio (WebAudio合成) ---------------- */
let AC=null;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}
}
function tone(f,d,type,vol,slide,delay){
  if(!AC||!soundOn)return;
  const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(vol||.06,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.03);
}
let noiseBuf=null;
function noise(d,vol,hp){
  if(!AC||!soundOn)return;
  if(!noiseBuf){const n=AC.sampleRate;noiseBuf=AC.createBuffer(1,n,n);const c=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)c[i]=Math.random()*2-1}
  const s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;
  const g=AC.createGain();const t=AC.currentTime;g.gain.setValueAtTime(vol||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+d+.02);
}
const SFX={
  swing:()=>noise(.07,.05,2500),
  hit:()=>{tone(170,.07,'square',.06,-90);noise(.05,.07,1200)},
  crit:()=>{tone(900,.08,'square',.05,-500);noise(.07,.09,1500)},
  jump:()=>tone(280,.1,'square',.04,260),
  hurt:()=>tone(220,.22,'sawtooth',.09,-160),
  shoot:()=>tone(720,.07,'square',.035,-420),
  ebolt:()=>tone(420,.1,'triangle',.05,-200),
  kill:()=>{tone(380,.1,'square',.05,-280);noise(.09,.05,700)},
  pick:()=>{tone(660,.07,'square',.05);tone(990,.09,'square',.05,0,.07)},
  portal:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.14,'square',.045,0,i*.08)),
  skill:()=>tone(220,.25,'sawtooth',.06,620),
  boom:()=>{noise(.35,.14,150);tone(90,.3,'sine',.16,-55)},
  dash:()=>noise(.09,.05,3200),
  heal:()=>[523,784,1046].forEach((f,i)=>tone(f,.14,'triangle',.07,0,i*.06)),
  select:()=>tone(880,.05,'square',.035),
  up:()=>[392,523,659,784].forEach((f,i)=>tone(f,.12,'square',.045,0,i*.06)),
  shield:()=>tone(1200,.12,'triangle',.06,-600),
  zap:()=>{noise(.1,.06,4000);tone(1400,.08,'square',.03,-900)},
  over:()=>[392,330,262,196].forEach((f,i)=>tone(f,.25,'triangle',.08,0,i*.2)),
  win:()=>[523,659,784,1046,784,1046].forEach((f,i)=>tone(f,.18,'square',.05,0,i*.12)),
};
const sfxLast={};
function sfx(n){
  if(!soundOn||!AC)return;
  const now=performance.now(); if(sfxLast[n]&&now-sfxLast[n]<45)return; sfxLast[n]=now;
  try{SFX[n]&&SFX[n]()}catch(e){}
}

/* ---------------- Sprites ---------------- */
function mk(rows,pal){
  const h=rows.length,w=Math.max(...rows.map(r=>r.length));
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<rows[y].length;x++){const col=pal[rows[y][x]];if(col){g.fillStyle=col;g.fillRect(x,y,1,1)}}
  return c;
}
function flipC(c){const f=document.createElement('canvas');f.width=c.width;f.height=c.height;const g=f.getContext('2d');g.translate(c.width,0);g.scale(-1,1);g.drawImage(c,0,0);return f}
function tintC(c,col){const f=document.createElement('canvas');f.width=c.width;f.height=c.height;const g=f.getContext('2d');g.drawImage(c,0,0);g.globalCompositeOperation='source-in';g.fillStyle=col;g.fillRect(0,0,c.width,c.height);return f}
function spr(rows,pal){const r=mk(rows,pal);const l=flipC(r);return{r,l,wr:tintC(r,'#fff'),wl:tintC(l,'#fff'),w:r.width,h:r.height}}

const HEADS={
helm:["....AA....","...OAAO...","..OHHHHO..",".OHHHHHHO.",".OhHSSESO.",".OhHSSSSO.","..OOOOOO.."],
horn:[".O......O.",".OA....AO.","..OAOOOAO.","..OHHHHHO.",".OHHSSESO.",".OHSSSSSO.","..OHHHHO.."],
mask:["...OOOO...","..OHHHHO..",".OHHHHHHO.",".OHHSSESO.",".OHHHHHHO.","AAOOOOOO.."],
hood:["...OO.....","..OHHO....","..OHHHOO..",".OHHHHHHO.",".OHhSSESO.",".OHhSSSSO.","..OOOOOO.."],
wizard:["......OO..",".....OHO..","....OHHO..","...OHHHO..","..OHHHHHO.","OOAAAAAAOO",".OhHSSESO.",".OhSSSSSO.","..OOOOOO.."],
crest:["..OAAAO...","...OAAAO..","..OHHHHO..",".OHHHHHHO.",".OhHSSESO.",".OhHSSSSO.","..OOOOOO.."],
cowl:["...OOOO...","..OHHHHO..",".OHHAHHHO.",".OHSSSESO.",".OHSSSSSO.","..OHOOHO.."],
knot:["....OO....","...OHHO...","..OHHHHO..",".OAAAAAAO.",".OHSSSESO.",".OSSSSSSO.","..OOOOOO.."],
};
const BODY={
idle:["..OBBBBO..",".OBBBBBBO.",".SOBbbBOS.","..OBBBBO..","..OLLLLO..","..OLOOLO..","..OL..LO..","..OO..OO.."],
run1:["..OBBBBO..",".OBBBBBBO.",".SOBbbBOS.","..OBBBBO..","..OLLLLO..",".OLO..OLO.",".OL....LO.",".OO....OO."],
run2:["..OBBBBO..",".OBBBBBBO.",".SOBbbBOS.","..OBBBBO..","..OLLLLO..","...OLLO...","...OLLO...","...OOOO..."],
jump:["..OBBBBO..","SOBBBBBBOS","..OBbbBO..","..OBBBBO..","..OLLLLO..","..OLOOLO..",".OL...OL..",".OO...OO.."],
};

const HEROES=[
 {id:'knight',name:'騎士',head:'helm',pal:{H:'#a8b2c6',h:'#6b7489',A:'#e04848',B:'#4a6fd0',b:'#34509a',L:'#5a5f70'},
  hp:120,atk:12,spd:1.0,jumps:1,rate:20,type:'melee',reach:22,hh:20,kb:2.2,wpn:'sword',skill:'bash',cd:240,
  role:'バランス型',desc:'攻守のバランスが良い剣士。はじめての人におすすめ。',sname:'シールドチャージ',sdesc:'無敵状態で前に突進し、ぶつかった敵を吹き飛ばす。'},
 {id:'berserker',name:'狂戦士',head:'horn',pal:{H:'#d0582a',h:'#9a3a1a',A:'#eee4c8',B:'#8a5430',b:'#5a3420',L:'#4a3a2a',S:'#e2a878'},
  hp:155,atk:21,spd:0.9,jumps:1,rate:34,type:'melee',reach:28,hh:28,kb:3.5,wpn:'axe',skill:'whirl',cd:360,
  role:'パワー型',desc:'大斧の一撃は重いが振りは遅い。体力も多い。',sname:'大旋風',sdesc:'1秒間回転斬り。周りの敵を何度も切り刻む。'},
 {id:'ninja',name:'忍者',head:'mask',pal:{H:'#30304a',h:'#22223a',A:'#e03a3a',B:'#30304a',b:'#1e1e30',L:'#24243a'},

const DIG={'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001001001001','8':'111101111101111','9':'111101111001111','+':'000010111010000'};
function drawNum(str,x,y,col){
  str=String(str); const w=str.length*4-1; let sx=Math.round(x-w/2); y=Math.round(y);
  for(let pass=0;pass<2;pass++){
    ctx.fillStyle=pass?col:'#000';
    for(let i=0;i<str.length;i++){const d=DIG[str[i]];if(!d)continue;
      for(let k=0;k<15;k++)if(d[k]==='1'){const px=sx+i*4+(k%3),py=y+Math.floor(k/3);
        if(pass)ctx.fillRect(px,py,1,1);else ctx.fillRect(px-1,py-1,3,3);}}
  }
}

/* ---------------- Level generation ---------------- */
function setT(c,r,v){if(c>=0&&c<L.cols&&r>=0&&r<ROWS)L.t[r*L.cols+c]=v}
function tileAt(c,r){if(c<0||c>=L.cols||r<0||r>=ROWS)return 1;return L.t[r*L.cols+c]}
function groundRow(c){for(let r=1;r<ROWS;r++)if(tileAt(c,r)===1)return r;return ROWS}
function genLevel(floor){
  const boss=isBossFloor(floor);
  const cols=boss?Math.max(22,Math.ceil(W/T)+2):54+floor*5;
  L={cols,t:new Uint8Array(cols*ROWS),torches:[]};
  for(let c=0;c<cols;c++)setT(c,0,1);
  if(boss){
    for(let c=0;c<cols;c++){setT(c,ROWS-1,1);setT(c,ROWS-2,1)}
    const pr=ROWS-5;
    for(let c=3;c<7;c++)setT(c,pr,2);
    for(let c=cols-7;c<cols-3;c++)setT(c,pr,2);
    for(let c=Math.floor(cols/2)-2;c<Math.floor(cols/2)+2;c++)setT(c,pr-3,2);
  }else{
    let c=0,gh=2;
    while(c<cols){
      let len=c===0?10:ri(5,11);
      if(c+len>cols-9)len=cols-c;
      if(c>0&&len<cols-c+1&&c<cols-9)gh=clamp(gh+pick([-2,-1,0,0,1,2]),1,5);
      if(c+len>=cols)gh=clamp(gh,1,4);
      for(let i=0;i<len;i++)for(let r=ROWS-gh;r<ROWS;r++)setT(c+i,r,1);
      c+=len;
    }
    // floating one-way platforms
    let c2=12;
    while(c2<cols-12){
      if(Math.random()<.7){
        const pl=ri(3,6);let mr=ROWS;for(let i=0;i<pl;i++)mr=Math.min(mr,groundRow(c2+i));
        const pr=mr-3;
        if(pr>=3){for(let i=0;i<pl;i++)setT(c2+i,pr,2);
          if(Math.random()<.35&&pr-3>=3){const o=ri(1,2);for(let i=0;i<pl-1;i++)if(tileAt(c2+o+i,pr-3)===0)setT(c2+o+i,pr-3,2)}}
        c2+=pl+ri(3,7);
      }else c2+=ri(4,7);
    }
  }
  for(let c=6;c<cols;c+=ri(9,14))L.torches.push({c,r:ri(2,4)});
}

function spawnEnemy(type,x,y,elite){
  const d=EDEF[type],f=run.floor;

  const e={type,x,y:y-d.h,w:d.w,h:d.h,vx:0,vy:0,face:-1,hp:Math.round(d.hp*hpS*(elite?2.6:1)),dmg:Math.round(d.dmg*dS*(elite?1.3:1)),

function populate(){
  const f=run.floor;
  const wt=zone===0?(f===1?{slime:55,skel:30,bat:15,archer:0}:{slime:40,skel:30,bat:20,archer:10})
          :zone===1?{slime:22,skel:33,bat:25,archer:20}:{slime:20,skel:30,bat:25,archer:25};
  const n=Math.round(7+f*1.4);
  const choose=()=>{let s=0;for(const k in wt)s+=wt[k];let r=Math.random()*s;for(const k in wt){r-=wt[k];if(r<0)return k}return'slime'};
  const used=new Set();
  for(let i=0;i<n;i++){
    let c,tries=0;do{c=ri(14,L.cols-6);tries++}while(used.has(c)&&tries<20);used.add(c);
    const type=choose();const elite=Math.random()<.08+f*.01;
    if(type==='bat'){spawnEnemy('bat',c*T,ri(3,5)*T,elite)}
    else{
      let gy=groundRow(c)*T;
      for(let r=1;r<groundRow(c);r++)if(tileAt(c,r)===2&&Math.random()<.5){gy=r*T;break}
      const e=spawnEnemy(type,c*T+4,gy,elite);e.onGround=true;
    }
  }
}

function showUpgrade(cleared){
  state='upgrade';
  const pool=UPG.filter(u=>(run.ups[u.id]||0)<u.max&&(u.id!=='potion'||P.hp<S.maxhp*.7));
  const opts=[];while(opts.length<3&&pool.length){const i=Math.floor(Math.random()*pool.length);opts.push(pool.splice(i,1)[0])}
  $('upTitle').textContent=isBossFloor(cleared)?'ボス撃破！ HP40%回復':`B${cleared}F クリア！`;
  const box=$('upCards');box.innerHTML='';
  for(const u of opts){
    const b=document.createElement('button');b.className='ucard';
    const lv=run.ups[u.id]||0;
    b.innerHTML=`<div class="ic">${u.ic}</div><div class="nm">${u.nm}</div><div class="ds">${u.ds}</div><div class="lv">${u.max>1&&u.max<99?`所持 ${lv}/${u.max}`:''}</div>`;
    b.onclick=()=>{sfx('pick');u.ap();run.ups[u.id]=lv+1;P.hp=Math.min(P.hp,S.maxhp);run.floor++;startFloor()};
    box.appendChild(b);
  }
  showScreen('upgrade');fadeIn();
}

/* ---------------- Combat helpers ---------------- */
function addNum(x,y,v,col,big){nums.push({x,y,v,t:big?50:38,col:col||'#fff',big})}
function burst(x,y,col,n,sp,life){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(.3,sp||2);
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.5,life:ri(12,life||28),max:life||28,col,g:.06,sz:Math.random()<.3?2:1})}}
function shake(m,t){shakeM=Math.max(shakeM,m);shakeT=Math.max(shakeT,t)}
function atkPow(){return hero.atk*S.atkMul}
function damageEnemy(e,base,o){
  o=o||{};
  if(e.dead||(e.boss&&e.state==='intro'))return;
  const crit=!o.noCrit&&Math.random()<S.crit;
  const dmg=Math.max(1,Math.round(base*(crit?2:1)*rnd(.92,1.08)));
  e.hp-=dmg;e.flash=6;run.dmg+=dmg;
  addNum(cx(e)+rnd(-3,3),e.y-2,dmg,crit?'#ffe040':(o.col||'#fff'),crit);
  if(!e.boss){const kb=(o.kb!=null?o.kb:hero.kb||2);const dir=o.dir||sign(cx(e)-cx(P));
    e.vx=dir*kb*(e.elite?.5:1);if(!e.fly)e.vy=Math.min(e.vy,-1.2);else e.vy+=rnd(-1,1);e.stun=10;}
  burst(cx(e),cy(e),o.col||'#fff',crit?8:4,2,16);
  if(!o.quiet){sfx(crit?'crit':(e.boss?'bosshit':'hit'));hitstop=Math.max(hitstop,crit?3:2);if(crit)shake(1.5,5)}
  if(!o.noProc){
    if(S.fire>0){e.burn=180;e.burnDmg=Math.max(1,Math.round(1.5+atkPow()*.12*S.fire))}
    if(S.thunder>0&&Math.random()<.2*S.thunder){
      let best=null,bd=90;for(const o2 of enemies){if(o2===e||o2.dead)continue;const d=Math.hypot(cx(o2)-cx(e),cy(o2)-cy(e));if(d<bd){bd=d;best=o2}}
      const tgt=best||e;effects.push({type:'zap',x1:cx(e),y1:cy(e),x2:cx(tgt),y2:cy(tgt),t:10});sfx('zap');
      damageEnemy(tgt,atkPow()*.7,{noProc:true,quiet:true,col:'#9ef'});
    }
  }
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
  if(e.dead)return;e.dead=true;run.kills++;
  burst(cx(e),cy(e),'#fff',10,2.5,26);burst(cx(e),cy(e),e.boss?'#ffb030':'#c8a0ff',8,2,22);
  sfx('kill');
  if(S.vamp>0&&P.hp<S.maxhp){P.hp=Math.min(S.maxhp,P.hp+S.vamp);addNum(cx(P),P.y-6,'+'+S.vamp,'#7f7')}
  if(!e.boss&&(e.elite||Math.random()<.07))pickups.push({x:cx(e)-3,y:e.y,vy:-2,w:7,h:6,t:0});
  if(e.boss){
    shake(6,40);sfx('boom');
    for(let i=0;i<6;i++)effects.push({type:'boom',x:cx(e)+rnd(-16,16),y:cy(e)+rnd(-16,16),r:0,max:rnd(14,24),t:0,delay:i*8});
    $('bossBar').classList.add('hide');
    enemies.forEach(o=>{if(!o.dead&&o!==e){o.dead=true;burst(cx(o),cy(o),'#fff',6)}});
  }
}
function hurtPlayer(dmg,srcX){
  if(P.dead||P.inv>0||P.dashT>0||(P.skillT>0&&['bash','charge','iai'].includes(P.skillKind)))return;
  if(P.shieldReady){P.shieldReady=false;P.shieldT=0;P.inv=40;sfx('shield');burst(cx(P),cy(P),'#9ef',12,2.5);return}
  P.hp-=dmg;P.inv=55;P.vx=sign(cx(P)-srcX)*2.2;P.vy=-2.2;
  addNum(cx(P),P.y-4,dmg,'#ff6a6a',false);sfx('hurt');shake(3,10);hitstop=4;
  burst(cx(P),cy(P),'#ff5a5a',8,2);
  if(S.thorns>0){effects.push({type:'ring',x:cx(P),y:cy(P),r:4,max:46,t:0,col:'#9f9'});
    for(const e of enemies)if(!e.dead&&Math.hypot(cx(e)-cx(P),cy(e)-cy(P))<48)damageEnemy(e,atkPow()*1.2*S.thorns,{noProc:true,quiet:true,col:'#9f9'})}
  if(P.hp<=0){
    if(S.revive>0){S.revive--;run.ups.revive=(run.ups.revive||1);P.hp=Math.round(S.maxhp*.5);P.inv=150;sfx('heal');banner('不死鳥の羽で復活！','');
      effects.push({type:'ring',x:cx(P),y:cy(P),r:4,max:70,t:0,col:'#ffb040'});
      for(const e of enemies)if(!e.dead&&!e.boss&&Math.hypot(cx(e)-cx(P),cy(e)-cy(P))<70)damageEnemy(e,atkPow()*3,{quiet:true,noProc:true,col:'#ffb040'});}
    else{P.hp=0;P.dead=true;deadTimer=110;burst(cx(P),cy(P),'#fff',20,3,40);sfx('over')}
  }
}
function pProj(o){projs.push(Object.assign({owner:'p',life:90,w:6,h:3,vx:0,vy:0,grav:0,pierce:false,hit:new Set(),delay:0,through:false},o))}
function eProj(o){projs.push(Object.assign({owner:'e',life:240,w:5,h:5,vx:0,vy:0,grav:0,delay:0,through:false},o))}

/* ---------------- Player ---------------- */
function doAttack(){
  P.atkCd=Math.max(5,Math.round(hero.rate*S.rateMul));
  const a=atkPow(),px=cx(P),py=P.y+6;
  if(hero.type==='melee'){P.swing=P.swingMax=Math.min(12,Math.max(7,Math.round(P.atkCd*.6)));P.hitSet=new Set();sfx('swing')}
  else if(hero.type==='arrow'){pProj({kind:'arrow',x:px+P.face*4,y:py,vx:P.face*5.2,w:8,h:2,dmg:a,life:70});P.swing=P.swingMax=8;sfx('shoot')}
  else if(hero.type==='fire'){pProj({kind:'fire',x:px+P.face*5,y:py-1,vx:P.face*3.2,w:6,h:6,dmg:a,life:80,explode:16});P.swing=P.swingMax=10;sfx('shoot')}
  if(S.wave>0){pProj({kind:'wave',x:px+P.face*6,y:P.y+2,vx:P.face*3.6,w:8,h:12,dmg:a*(.35+.2*S.wave),life:40,pierce:true})}
}
function doSkill(){
  P.skillCd=Math.round(hero.cd*S.cdMul);sfx('skill');
  const a=atkPow(),px=cx(P);
  switch(hero.skill){
    case'bash':P.skillT=16;P.skillKind='bash';P.hitSet=new Set();break;
    case'whirl':P.skillT=60;P.skillKind='whirl';break;
    case'charge':P.skillT=24;P.skillKind='charge';P.hitSet=new Set();break;
    case'iai':P.skillT=14;P.skillKind='iai';break;
    case'shuriken':for(let i=-2;i<=2;i++){const an=i*.13;pProj({kind:'shuriken',x:px,y:P.y+6,vx:Math.cos(an)*4.6*P.face,vy:Math.sin(an)*4.6,w:6,h:6,dmg:a*.9,life:70,pierce:true})}break;
    case'volley':for(let i=0;i<10;i++){pProj({kind:'rain',x:px+P.face*(26+i*11)+rnd(-4,4),y:18,vx:P.face*.4,vy:5,w:3,h:9,dmg:a*1.1,life:60,delay:i*3,pierce:true,through:true})}break;
    case'meteor':{let best=null,bd=220;for(const e of enemies){if(e.dead)continue;const d=Math.abs(cx(e)-px);if(d<bd&&Math.abs(cy(e)-cy(P))<120){bd=d;best=e}}
      const tx=best?cx(best):px+P.face*70;const ty=best?cy(best):cy(P);
      hazards.push({type:'meteor',x:tx,y:ty,t:32,r:42,dmg:a*4.2});break;}
    case'heal':{const h=Math.round(S.maxhp*.3);P.hp=Math.min(S.maxhp,P.hp+h);addNum(px,P.y-8,'+'+h,'#7f7',true);sfx('heal');
      effects.push({type:'ring',x:px,y:cy(P),r:4,max:58,t:0,col:'#fff2a0'});burst(px,cy(P),'#fff2a0',16,2.5);
      for(const e of enemies)if(!e.dead&&Math.hypot(cx(e)-px,cy(e)-cy(P))<60)damageEnemy(e,a*1.8,{quiet:true,col:'#fff2a0'});break;}
  }
}
function meleeBox(reach,hh){const c=cx(P);return{x:P.face>0?c:c-reach,y:P.y+P.h/2-hh/2,w:reach,h:hh}}
function updatePlayer(){
  if(P.dead){P.vy=Math.min(P.vy+.26,5);moveEnt(P);return}
  for(const k of['inv','atkCd','skillCd','dashCd'])if(P[k]>0)P[k]--;
  let mv=(inp.right?1:0)-(inp.left?1:0);
  const busy=P.skillT>0&&(P.skillKind==='iai'||P.skillKind==='bash'||P.skillKind==='charge');
  if(P.dashT>0){P.dashT--;P.vx=P.face*4.2;P.vy=Math.min(P.vy,.5);if(tick%2===0)effects.push({type:'after',x:P.x,y:P.y,face:P.face,frame:'run1',t:12})}
  else if(busy){/* handled below */}
  else{if(mv)P.face=mv;const tgt=mv*1.5*S.spd;P.vx+=(tgt-P.vx)*(P.onGround?.35:.2)}
  // jump
  if(prs.jump&&!busy){
    if(P.onGround||P.coyote>0){P.vy=-5.4;P.coyote=0;P.jumpsLeft=S.jumps-1;sfx('jump');burst(cx(P),P.y+P.h,'#bbb',4,1,12)}
    else if(P.jumpsLeft>0){P.jumpsLeft--;P.vy=-4.9;sfx('jump');effects.push({type:'ring',x:cx(P),y:P.y+P.h,r:2,max:10,t:0,col:'#fff'})}
  }
  if(!inp.jump&&P.vy<0)P.vy+=.28;
  if(prs.dash&&P.dashCd<=0&&!busy){P.dashT=10;P.dashCd=42;P.inv=Math.max(P.inv,14);if(mv)P.face=mv;sfx('dash')}
  if(inp.attack&&P.atkCd<=0&&!busy&&P.dashT<=0)doAttack();
  if(prs.skill&&P.skillCd<=0&&!busy&&P.dashT<=0)doSkill();
  // skills in progress
  if(P.skillT>0){
    P.skillT--;const a=atkPow();
    if(P.skillKind==='bash'||P.skillKind==='charge'){
      P.vx=P.face*(P.skillKind==='bash'?5:5.4);P.vy=Math.min(P.vy,.6);
      if(tick%2===0)effects.push({type:'after',x:P.x,y:P.y,face:P.face,frame:'run1',t:10});
      const box={x:P.x-4,y:P.y-2,w:P.w+8,h:P.h+4};
      for(const e of enemies)if(!e.dead&&!P.hitSet.has(e)&&overlap(box,e)){P.hitSet.add(e);damageEnemy(e,a*(P.skillKind==='bash'?2:1.7),{kb:P.skillKind==='bash'?5:2,dir:P.face})}
    }else if(P.skillKind==='whirl'){
      if(P.skillT%9===0){sfx('swing');for(const e of enemies)if(!e.dead&&Math.hypot(cx(e)-cx(P),cy(e)-cy(P))<36)damageEnemy(e,a*.75,{quiet:P.skillT%18!==0,kb:1.5})}
    }else if(P.skillKind==='iai'){
      P.vx=0;
      if(P.skillT===1){
        const sx=P.x;let nx=P.x;
        for(let i=0;i<100;i++){const tx=nx+P.face;const c=Math.floor((P.face>0?tx+P.w:tx)/T);
          if(tileAt(c,Math.floor((P.y+2)/T))===1||tileAt(c,Math.floor((P.y+P.h-2)/T))===1)break;nx=tx}
        const band={x:Math.min(sx,nx),y:P.y-4,w:Math.abs(nx-sx)+P.w,h:P.h+8};
        P.x=nx;P.inv=Math.max(P.inv,30);
        effects.push({type:'slashline',x1:sx+P.w/2,x2:nx+P.w/2,y:cy(P),t:16});shake(3,8);
        for(const e of enemies)if(!e.dead&&overlap(band,e))damageEnemy(e,a*3.2,{kb:2,dir:P.face});
      }
    }
    if(P.skillT===0)P.skillKind=null;
  }
  // melee swing hits
  if(P.swing>0){
    P.swing--;
    if(hero.type==='melee'){
      const prog=1-P.swing/P.swingMax;
      if(prog>.15&&prog<.75){const b=meleeBox(hero.reach,hero.hh);
        for(const e of enemies)if(!e.dead&&!P.hitSet.has(e)&&overlap(b,e)){P.hitSet.add(e);damageEnemy(e,atkPow())}
        for(const pr of projs)if(pr.owner==='e'&&pr.kind!=='rock'&&!pr.dead&&overlap(b,pr)){pr.dead=true;burst(pr.x,pr.y,'#fff',4)}}
    }
  }
  P.vy=Math.min(P.vy+.26,5.5);
  const wasG=P.onGround;moveEnt(P);
  if(P.onGround){P.coyote=6;P.jumpsLeft=S.jumps-1;if(!wasG)burst(cx(P),P.y+P.h,'#aaa',3,.8,10)}else if(P.coyote>0)P.coyote--;
  // shield recharge
  if(S.shield>0&&!P.shieldReady){P.shieldT++;if(P.shieldT>=Math.round(600/S.shield)){P.shieldReady=true;sfx('shield')}}
  // orbs
  if(S.orbs>0){P.orbA+=.07;
    for(let i=0;i<S.orbs;i++){const an=P.orbA+i*Math.PI*2/S.orbs;const ox=cx(P)+Math.cos(an)*20,oy=cy(P)+Math.sin(an)*14;
      const ob={x:ox-3,y:oy-3,w:6,h:6};
      for(const e of enemies){if(e.dead)continue;const last=P.orbHit.get(e)||-99;if(tick-last>24&&overlap(ob,e)){P.orbHit.set(e,tick);damageEnemy(e,atkPow()*.55,{quiet:true,noProc:true,kb:1,col:'#d0a0ff'})}}}}
  // pickups
  for(const h of pickups)if(!h.got&&overlap(P,h)){h.got=true;const v=Math.round(S.maxhp*.15);P.hp=Math.min(S.maxhp,P.hp+v);addNum(cx(P),P.y-6,'+'+v,'#7f7');sfx('pick')}
  // portal
  if(portal&&!portal.used&&overlap(P,portal)){portal.used=true;enterPortal()}
  P.anim+=Math.abs(P.vx)*.12;
}

/* ---------------- Physics ---------------- */
function moveEnt(e){
  e.hitWall=0;
  e.x+=e.vx;
  const top=Math.floor(e.y/T),bot=Math.floor((e.y+e.h-.01)/T);
  if(e.vx>0){const c=Math.floor((e.x+e.w-.01)/T);for(let r=top;r<=bot;r++)if(tileAt(c,r)===1){e.x=c*T-e.w;e.hitWall=1;e.vx=0;break}}
  else if(e.vx<0){const c=Math.floor(e.x/T);for(let r=top;r<=bot;r++)if(tileAt(c,r)===1){e.x=(c+1)*T;e.hitWall=-1;e.vx=0;break}}
  const pb=e.y+e.h;e.y+=e.vy;e.onGround=false;
  const l=Math.floor(e.x/T),rr=Math.floor((e.x+e.w-.01)/T);
  if(e.vy>=0){const r=Math.floor((e.y+e.h)/T);
    for(let c=l;c<=rr;c++){const t=tileAt(c,r);if(t===1||(t===2&&pb<=r*T+.5)){e.y=r*T-e.h;e.vy=0;e.onGround=true;break}}}
  else{const r=Math.floor(e.y/T);for(let c=l;c<=rr;c++)if(tileAt(c,r)===1){e.y=(r+1)*T;e.vy=0;break}}
}
function edgeAhead(e,dir){const c=Math.floor((dir>0?e.x+e.w+2:e.x-2)/T),r=Math.floor((e.y+e.h+2)/T);return tileAt(c,r)===0}
function wallAhead(e,dir){const c=Math.floor((dir>0?e.x+e.w+1:e.x-1)/T);return tileAt(c,Math.floor((e.y+e.h-2)/T))===1}

/* ---------------- Enemy AI ---------------- */
function updateEnemy(e){
  if(e.flash>0)e.flash--;
  e.anim++;
  if(e.burn>0){e.burn--;if(e.burn%30===0){damageEnemy(e,e.burnDmg,{noProc:true,quiet:true,noCrit:true,kb:0,col:'#ff9a3a'})}
    if(tick%6===0)parts.push({x:cx(e)+rnd(-3,3),y:e.y+rnd(0,e.h),vx:0,vy:-.6,life:14,max:14,col:pick(['#ff9a3a','#ffd040']),g:0,sz:1})}
  if(e.dead)return;
  if(e.boss){updateBoss(e);return}
  const dx=cx(P)-cx(e),dy=cy(P)-cy(e),dist=Math.hypot(dx,dy);
  if(e.stun>0){e.stun--;e.vx*=.85;if(!e.fly){e.vy=Math.min(e.vy+.26,5);moveEnt(e)}else{e.x+=e.vx;e.y+=e.vy;e.vy*=.85}return}
  switch(e.type){
    case'slime':
      if(e.onGround){e.vx*=.7;if(--e.t<=0){
        if(dist<170&&!P.dead){e.vy=-rnd(3,4.2);e.vx=sign(dx)*rnd(.9,1.4);e.face=sign(dx);e.t=ri(45,80)}
        else{e.vy=-2;e.vx=e.dir*.6;e.dir*=-1;e.t=ri(70,110)}}}
      e.vy=Math.min(e.vy+.24,5);moveEnt(e);break;
    case'skel':
      if(e.atk>0){e.atk--;e.vx=0;
        if(e.atk===10){const b={x:e.face>0?cx(e):cx(e)-18,y:e.y,w:18,h:e.h};if(overlap(b,P))hurtPlayer(Math.round(e.dmg*1.2),cx(e));sfx('swing')}}
      else{if(e.cd>0)e.cd--;
        if(Math.abs(dx)<150&&Math.abs(dy)<36&&!P.dead){e.face=sign(dx);
          if(Math.abs(dx)<20&&e.cd<=0){e.atk=30;e.cd=ri(60,90)}
          else e.vx=(wallAhead(e,e.face)||edgeAhead(e,e.face))?0:e.face*(.65+zone*.08)}
        else{if(wallAhead(e,e.dir)||edgeAhead(e,e.dir))e.dir*=-1;e.vx=e.dir*.35;e.face=e.dir}}
      e.vy=Math.min(e.vy+.26,5);moveEnt(e);break;
    case'archer':
      e.face=sign(dx);
      if(e.atk>0){e.atk--;e.vx=0;if(e.atk===0){const sp=3;const vy=clamp(dy/Math.max(30,Math.abs(dx))*sp,-1.5,1.5);

function bossPick(e,opts){e.state=pick(opts);e.t=0;e.count=0;e.airT=0}

      case'stunned':e.vx=0;if(++e.t>60)bossPick(e,['walk']);break;

          eProj({kind:'flame',x:cx(e)+e.face*10,y:e.y+10,vx:Math.cos(an)*2.7*sp,vy:Math.sin(an)*2.7*sp,w:6,h:6,dmg:e.dmg,through:true});sfx('ebolt')}

/* ---------------- Projectiles / hazards ---------------- */
function updateProjs(){
  for(const p of projs){
    if(p.dead)continue;
    if(p.delay>0){p.delay--;continue}
    p.vy+=p.grav;p.x+=p.vx;p.y+=p.vy;if(--p.life<=0){p.dead=true;if(p.explode)explodeAt(p.x,p.y,p.explode,p.dmg*.7);continue}
    if(p.kind==='fire'&&tick%3===0)parts.push({x:p.x,y:p.y,vx:rnd(-.3,.3),vy:rnd(-.5,0),life:12,max:12,col:pick(['#ffb030','#ff6020','#ffe060']),g:0,sz:1});
    if(p.kind==='flame'&&tick%3===0)parts.push({x:p.x,y:p.y,vx:0,vy:-.3,life:10,max:10,col:'#ff7030',g:0,sz:1});
    if(p.kind==='bolt'&&tick%4===0)parts.push({x:p.x,y:p.y,vx:0,vy:0,life:10,max:10,col:'#b070ff',g:0,sz:1});
    const solid=tileAt(Math.floor(p.x/T),Math.floor(p.y/T))===1;
    if(solid&&!(p.through&&p.y<(ROWS-2)*T+4&&p.kind!=='rain')){
      if(p.kind==='rain'||!p.through){p.dead=true;burst(p.x,p.y,p.kind==='rock'?'#998':'#ddd',4,1.2,12);if(p.explode)explodeAt(p.x,p.y,p.explode,p.dmg*.7);continue}
    }
    if(p.x<-20||p.x>L.cols*T+20||p.y>ROWS*T+20){p.dead=true;continue}
    const box={x:p.x-p.w/2,y:p.y-p.h/2,w:p.w,h:p.h};
    if(p.owner==='p'){
      for(const e of enemies){if(e.dead||p.hit.has(e))continue;
        if(overlap(box,e)){p.hit.add(e);
          if(p.explode){p.dead=true;explodeAt(p.x,p.y,p.explode,p.dmg*.7);damageEnemy(e,p.dmg,{dir:sign(p.vx)});break}
          damageEnemy(e,p.dmg,{dir:sign(p.vx||1),kb:p.kind==='rain'?.5:1.5,quiet:p.kind==='rain'});
          if(!p.pierce){p.dead=true;break}}}
    }else if(!P.dead&&overlap(box,P)){hurtPlayer(p.dmg,p.x);if(P.inv>0||P.dead)p.dead=true}
  }
  projs=projs.filter(p=>!p.dead);
}
function explodeAt(x,y,r,dmg){
  effects.push({type:'boom',x,y,r:0,max:r,t:0,delay:0});sfx('boom');shake(2,6);
  for(const e of enemies)if(!e.dead&&Math.hypot(cx(e)-x,cy(e)-y)<r+6)damageEnemy(e,dmg,{quiet:true,dir:sign(cx(e)-x),col:'#ffb030'});
}
function updateHazards(){
  for(const h of hazards){
    if(h.type==='wave'){h.x+=h.dir*h.sp;h.t--;
      const c=Math.floor(h.x/T);if(tileAt(c,Math.floor((h.y-4)/T))===1)h.t=0;
      if(tick%2===0)parts.push({x:h.x,y:h.y-rnd(0,8),vx:0,vy:-rnd(.5,1.2),life:14,max:14,col:h.fire?pick(['#ff7030','#ffd040']):pick(['#bba','#887']),g:.02,sz:2});
      if(!P.dead&&overlap({x:h.x-5,y:h.y-12,w:10,h:12},P))hurtPlayer(h.dmg,h.x-h.dir*10);
    }else if(h.type==='pillar'){h.t++;
      if(h.t>h.warn&&h.t<=h.warn+h.dur){if(h.t===h.warn+1){sfx('boom');shake(2,4)}
        if(!P.dead&&overlap({x:h.x-8,y:0,w:16,h:H},P))hurtPlayer(h.dmg,h.x);
        if(tick%2===0)for(let i=0;i<3;i++)parts.push({x:h.x+rnd(-7,7),y:rnd(T,ROWS*T-T),vx:0,vy:-rnd(1,2.5),life:14,max:14,col:pick(['#ff7030','#ffd040','#ff3a20']),g:0,sz:2})}
      if(h.t>h.warn+h.dur)h.done=true;
    }else if(h.type==='meteor'){h.t--;
      if(h.t<=0){h.done=true;effects.push({type:'boom',x:h.x,y:h.y,r:0,max:h.r,t:0,delay:0});sfx('boom');shake(5,14);
        for(const e of enemies)if(!e.dead&&Math.hypot(cx(e)-h.x,cy(e)-h.y)<h.r+8)damageEnemy(e,h.dmg,{quiet:true,dir:sign(cx(e)-h.x),kb:3,col:'#ffb030'});
        burst(h.x,h.y,'#ffb030',24,3.5,30)}
    }
    if(h.t<=0&&h.type==='wave')h.done=true;

/* ---------------- Main update ---------------- */
function update(){
  tick++;
  for(const k in inp)prs[k]=inp[k]&&!prv[k];
  Object.assign(prv,inp);
  if(fadeDir){fade+=fadeDir*.07;if(fade>=1&&fadeDir>0){fade=1;fadeDir=0;const cb=fadeCb;fadeCb=null;cb&&cb()}else if(fade<=0&&fadeDir<0){fade=0;fadeDir=0}}
  if(state!=='play')return;
  if(hitstop>0){hitstop--;return}
  run.time++;
  updatePlayer();
  for(const e of enemies)updateEnemy(e);
  enemies=enemies.filter(e=>!e.dead||e.burn>0&&false);
  updateProjs();updateHazards();
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life--}
  parts=parts.filter(p=>p.life>0);if(parts.length>500)parts.splice(0,parts.length-500);
  for(const n of nums){n.y-=.45;n.t--}nums=nums.filter(n=>n.t>0);
  for(const f of effects){if(f.delay>0){f.delay--;continue}f.t++;if(f.r!=null&&f.max)f.r+=(f.max-f.r)*.25}
  effects=effects.filter(f=>f.delay>0||f.t<(f.type==='boom'?18:f.type==='ring'?16:f.type==='after'?f.t+1&&12:f.type==='zap'?10:16));
  for(const h of pickups){if(h.got)continue;h.vy=Math.min(h.vy+.2,3);h.y+=h.vy;const r=Math.floor((h.y+h.h)/T),c=Math.floor((h.x+3)/T);const t=tileAt(c,r);
    if(t===1||t===2){h.y=r*T-h.h;h.vy=0}h.t++}
  pickups=pickups.filter(h=>!h.got&&h.t<1200);
  if(!portal&&enemies.every(e=>e.dead))openPortal();
  if(portal)portal.t++;
  // camera
  const lw=L.cols*T;
  const tgt=lw<=W?(lw-W)/2:clamp(cx(P)-W/2+P.face*24,0,lw-W);
  camX+=(tgt-camX)*.12;if(lw<=W)camX=tgt;
  const ty=clamp(cy(P)-H*.56,0,ROWS*T-H);camY+=(ty-camY)*.1;OY=-Math.round(camY);
  if(shakeT>0)shakeT--;else shakeM=0;
  if(P.dead&&--deadTimer<=0)gameOver();
  updateHud();
}

/* ---------------- Rendering ---------------- */
function drawSpr(s,x,yb,face,white,alpha){
  const img=white?(face>0?s.wr:s.wl):(face>0?s.r:s.l);

  ctx.drawImage(img,Math.round(x-s.w/2),Math.round(yb-s.h));
  ctx.globalAlpha=1;
}
function heroFrame(p){
  if(!p.onGround)return'jump';
  if(Math.abs(p.vx)>.3)return Math.floor(p.anim)%2?'run1':'run2';
  return'idle';
}

    case'staff':if(fwd){R(0,-2,9,1,'#7a5030');R(9,-4,3,3,'#ff9a3a');R(10,-3,1,1,'#fff')}else{R(0,-11,1,14,'#7a5030');R(-1,-14,3,3,'#60d0ff');R(0,-13,1,1,'#fff')}break;
    case'spear':if(fwd){R(0,0,20,1,'#8a6a3a');R(20,-1,3,3,'#e8eef8');R(23,0,1,1,'#fff')}else{R(0,-15,1,18,'#8a6a3a');R(-1,-17,3,2,'#e8eef8');R(0,-18,1,1,'#fff')}break;

function drawHero(g,h,x,yb,face,frame,opts){
  opts=opts||{};
  const s=HSPR[h.id][frame];const left=Math.round(x-s.w/2),top=Math.round(yb-s.h);
  const img=opts.white?(face>0?s.wr:s.wl):(face>0?s.r:s.l);
  if(opts.alpha!=null)g.globalAlpha=opts.alpha;
  if(!opts.noWeapon&&!opts.white&&opts.pose!=='fwd')drawWeapon(g,h,left,top,face,'up',HSPR[h.id].headRows);
  g.drawImage(img,left,top);
  if(!opts.noWeapon&&!opts.white&&opts.pose==='fwd')drawWeapon(g,h,left,top,face,'fwd',HSPR[h.id].headRows);

function drawBG(){
  ctx.fillStyle=Z.bg;ctx.fillRect(0,0,W,H);
  const off=-(camX*.5)%32;
  for(let x=off-32;x<W;x+=32)for(let y=OY;y<H;y+=32)ctx.drawImage(TS.bg,Math.floor(x),y);
  // torches (parallax .5)
  for(const t of L.torches){
    const x=Math.round(t.c*T*.5-camX*.5+T/2)+((L.cols*T>W)?0:Math.round(-camX*.5)),y=OY+t.r*T;
    if(x<-30||x>W+30)continue;
    const fl=Math.sin(tick*.3+t.c)*1.5;
    const gr=ctx.createRadialGradient(x,y,1,x,y,26+fl);
    gr.addColorStop(0,zone===1?'rgba(120,255,180,.25)':'rgba(255,170,70,.28)');gr.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gr;ctx.fillRect(x-30,y-30,60,60);
    ctx.fillStyle='#4a3020';ctx.fillRect(x-1,y,3,6);
    ctx.fillStyle=zone===1?'#7fffb0':'#ffb030';ctx.fillRect(x-1,y-3+(tick>>3)%2,3,3);
    ctx.fillStyle='#fff6c0';ctx.fillRect(x,y-2,1,1);
  }
  if(zone===2){const gr=ctx.createLinearGradient(0,H-40,0,H);gr.addColorStop(0,'rgba(255,80,20,0)');gr.addColorStop(1,'rgba(255,80,20,.25)');ctx.fillStyle=gr;ctx.fillRect(0,H-40,W,40)}
}
function drawTiles(){
  const c0=Math.floor(camX/T)-1,c1=Math.ceil((camX+W)/T)+1;
  for(let c=c0;c<=c1;c++)for(let r=0;r<ROWS;r++){
    const t=tileAt(c,r);if(!t)continue;
    const x=Math.round(c*T-camX),y=OY+r*T;
    if(t===1){ctx.drawImage(r>0&&tileAt(c,r-1)!==1?TS.top:TS.solid,x,y);
      if(c<0||c>=L.cols){ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(x,y,T,T)}}
    else if(t===2)ctx.drawImage(TS.plat,x,y);
  }
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  if(state==='title'||state==='select'||!L){renderMenuBG();drawFade();return}
  let sx=0,sy=0;if(shakeT>0){sx=Math.round(rnd(-shakeM,shakeM));sy=Math.round(rnd(-shakeM,shakeM))}

let last=0,acc=0;const STEP=1000/60;
function frame(t){
  requestAnimationFrame(frame);
  if(!last)last=t;let dt=Math.min(100,t-last);last=t;acc+=dt;let n=0;
  while(acc>=STEP&&n<4){if(state==='title'||state==='select'){tick++}else update();acc-=STEP;n++}
  if(n>=4)acc=0;
  render();
}
